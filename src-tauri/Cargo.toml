[package]
name = "valtracker"
version = "0.1.1"
description = "Suivi de performances Valorant"
authors = ["I4NIS"]
edition = "2024"

[lib]
name = "valtracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["time", "sync"] }
thiserror = "2.0.21"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-clipboard-manager = "2"
flate2 = "1.1.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
